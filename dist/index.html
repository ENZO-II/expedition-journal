<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b58e43"><meta name="description" content="用于西征团的共享地图、角色日记、行囊与公库。">
<title>远征手记 · Expedition Journal</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="stylesheet" href="style.css?v=20261003-12g"><link rel="stylesheet" href="manuscript.css?v=20261003-12g"><link rel="stylesheet" href="scrolls.css?v=20261003-12g"><link rel="stylesheet" href="rubrics.css?v=20261003-12g"><link rel="stylesheet" href="illuminated-navigation.css?v=20261003-12g"><link rel="stylesheet" href="desk.css?v=20261003-12g"><link rel="stylesheet" href="personal-pages.css?v=20261003-12g">
<link rel="stylesheet" href="painted-borders.css?v=20261003-12g"><link rel="stylesheet" href="map-workshop.css?v=20261003-12g">
</head>
<body>
<div id="app">
<header class="masthead">
  <a class="wordmark" href="./" aria-label="远征手记首页"><span class="seal" aria-hidden="true">远</span><span>远征手记</span></a>
  <div class="campaign-switch"><label class="sr-only" for="campaign-select">切换战役</label><select id="campaign-select"></select><button class="icon-button" id="new-campaign" title="创建战役" aria-label="创建战役">＋</button></div>
  <div class="header-actions"><button class="text-button" id="share-button">共用</button><button class="text-button" id="export-button">导出手记</button><button class="character-button" id="character-button"><span class="avatar">旅</span><span id="character-label">登记角色</span><span aria-hidden="true">⌄</span></button></div>
</header>
<div class="workspace">
<nav class="spine" aria-label="主要功能">
<button class="nav-tab active" data-view="map" aria-current="page"><span class="nav-capital" aria-hidden="true"><img src="assets/initial-m-v8.png" alt="" width="78" height="78"></span><span class="nav-label">地图</span></button>
<button class="nav-tab" data-view="journal"><span class="nav-capital" aria-hidden="true"><img src="assets/initial-d-v8.png" alt="" width="78" height="78"></span><span class="nav-label">手记目录</span></button>
<button class="nav-tab" data-view="bag"><span class="nav-capital" aria-hidden="true"><img src="assets/initial-s-v8.png" alt="" width="78" height="78"></span><span class="nav-label">行囊 · 公库</span></button>
<div class="spine-bottom"><button class="nav-tab" id="settings-button"><span aria-hidden="true"></span><span>设置</span></button><button class="nav-tab" id="about-button"><span aria-hidden="true">i</span><span>出处</span></button></div>
</nav>
<main class="main-surface" id="main"></main>
</div>
<footer class="status-bar"><span class="edition">远征手记</span><span id="save-status" role="status" aria-live="polite">已就绪</span></footer>
</div>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-frame"><div class="dialog-heading"><h2 id="dialog-title"></h2><button class="icon-button" id="close-dialog" aria-label="关闭">×</button></div><div id="dialog-content"></div></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="picture-upload" accept="image/png,image/jpeg,image/webp" hidden>
<input type="file" id="avatar-upload" accept="image/png,image/jpeg,image/webp" hidden>
<input type="file" id="map-upload" accept="image/png,image/jpeg,image/webp" hidden>
<input type="file" id="backup-upload" accept="application/json,.json" hidden>
<script type="module" src="app.js?v=20261003-12g"></script>
</body></html>
